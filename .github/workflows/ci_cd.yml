name: CI/CD Pipeline - Adaptive MLOps Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Code Quality & Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Flake8 & Black
        run: |
          black --check src tests || true
          flake8 src tests --max-line-length=120 --ignore=E501,W503 || true

      - name: Run Schema and Unit Tests
        run: |
          PYTHONPATH=src pytest tests/unit -v --cov=src --cov-report=xml

  integration-tests:
    name: API & Pipeline Integration Tests
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Seed test data
        run: |
          PYTHONPATH=src python scripts/seed_data.py --samples 500

      - name: Run Integration Tests
        run: |
          PYTHONPATH=src pytest tests/integration -v

  build-and-package:
    name: Container Build & Verification
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Serving Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/serving/Dockerfile
          push: false
          tags: adaptive-mlops/serving:latest

      - name: Build Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: src/dashboard
          file: src/dashboard/Dockerfile
          push: false
          tags: adaptive-mlops/dashboard:latest
