# Global System Configuration
project_name: "adaptive-vulnerability-mlops"
environment: "production"
log_level: "INFO"

storage:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "vulnerability_severity_v2"
  registered_model_name: "vulnerability_severity_classifier"

database:
  host: "localhost"
  port: 5432
  name: "mlops_vulnerability_db"
  user: "mlops_user"

serving:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  shadow_mode_enabled: true
