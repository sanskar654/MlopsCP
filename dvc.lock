      md5: e4d118bbb56b9253a24ea065b082adda
      size: 804923
  train:
    cmd: python -c "from src.training.trainer import VulnerabilityTrainer; t = 
      VulnerabilityTrainer(); 
      t.train_and_evaluate(data_path='data/processed/features.parquet')"
    deps:
    - path: data/processed/features.parquet
      hash: md5
      md5: e4d118bbb56b9253a24ea065b082adda
      size: 804923
