    - path: data/processed/real_cve_dataset.parquet
      hash: md5
      md5: feed2dcb46679435d252d85492dc97c6
      size: 49089
  validate:
    cmd: python -c "import pandas as pd; from src.validation.schema_validator 
      import VulnerabilitySchemaValidator; df = 
      pd.read_csv('data/raw/nvd_cves_recent.csv'); clean_df, _ = 
      VulnerabilitySchemaValidator().validate_raw(df.dropna(subset=['description',
      'base_severity'])); 
      clean_df.to_parquet('data/interim/validated_data.parquet', index=False)"
    deps:
    - path: data/raw/nvd_cves_recent.csv
      hash: md5
      md5: 7c03de1bb0b2c938ee6990d8d1cda2c8
