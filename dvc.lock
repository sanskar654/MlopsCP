schema: '2.0'
stages:
  ingest:
    cmd: python -c "from src.ingestion.backfill import 
      fetch_and_merge_real_data; fetch_and_merge_real_data(nvd_sample_size=50)"
    deps:
    - path: src/ingestion/cisa_kev_client.py
